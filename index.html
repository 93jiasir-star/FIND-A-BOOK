<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="找书：一次搜索，在各个阅读、购书与借阅平台继续探索。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg?v=10" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg?v=10">
  <title>寻页 · FIND A BOOK</title>
  <link rel="stylesheet" href="style.css?v=28">
</head>
<body>
  <main class="app-shell">
    <header class="hero"><div class="brand-row"><span class="brand-mark">F</span><span class="brand-chinese">寻页</span><span class="brand-divider" aria-hidden="true"></span><span>FIND A BOOK</span></div><p class="hero-whisper">于万卷之间，遇一页心意</p></header>

    <form id="searchForm" class="search-box">
      <label class="sr-only" for="bookInput">书名或作者</label>
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="bookInput" type="search" placeholder="书名 / 作者" autocomplete="off" autofocus>
      <button id="clearInput" class="clear-input" type="button" aria-label="清除搜索内容" hidden><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2 10 10M10 2 2 10"/></svg></button>
      <button type="submit">开始找书 <span>→</span></button>
    </form>
    <p class="search-hint">循着书页，去见更远的地方。</p>
    <section id="recentSearches" class="recent-searches" aria-label="最近搜索" hidden></section>

    <section id="results" class="results" aria-live="polite"></section>
  </main>
  <footer><span>寻页</span> · FIND A BOOK · 2026</footer>
  <script src="app.js?v=28"></script>
</body>
</html>
